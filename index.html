<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diário de Classe Digital</title>
    <meta name="description" content="Sistema de gestão escolar completo com controle de turmas, alunos, chamada, notas, planos de aula, BNCC, biblioteca escolar e relatórios em PDF e Excel." />
    <meta property="og:title" content="Diário de Classe Digital" />
    <meta property="og:description" content="Sistema de gestão escolar completo com controle de turmas, alunos, chamada, notas, planos de aula, BNCC, biblioteca escolar e relatórios em PDF e Excel." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suprime erros benignos de reconexão de WebSocket/HMR do Vite no iframe da sandbox do AI Studio
      (function() {
        function isViteHmrError(err, msg, filename) {
          var str = String(msg || '') + ' ' + String(filename || '') + ' ' + String(err && (err.message || err.stack || err.name) || '');
          return str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
                 str.indexOf('@vite/client') !== -1 ||
                 str.indexOf('vite:ws') !== -1;
        }

        window.addEventListener('error', function (event) {
          if (isViteHmrError(event.error, event.message, event.filename)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          if (isViteHmrError(event.reason, event.reason && event.reason.message)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
